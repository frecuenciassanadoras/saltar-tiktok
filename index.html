<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continuar al sitio — NeuroSync™</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- META TAGS DE PREVISUALIZACIÓN -->
    <meta property="og:title" content="NeuroSync™ | Acceso exclusivo">
    <meta property="og:description" content="Abre en tu navegador para desbloquear tu evolución.">
    <meta property="og:image" content="https://f005.backblazeb2.com/file/BACKUP-DE-IMAGENES/ESPIRITUALIDAD/NEUROSYNC2.0/PAGINA+DE+VENTAS+NUEVA/Dise%C3%B1o+sin+t%C3%ADtulo+(25).png">
    <meta property="og:type" content="website">

    <script>
        // REDIRECCIÓN INTELIGENTE
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isSocial = /TikTok|musical_ly|Instagram|FBAN|FBAV|Threads|Snapchat/i.test(ua);
            
            if (!isSocial) {
                // Si NO es social, redirigimos DE INMEDIATO a ventas
                window.location.replace('/ventas/');
            }
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* ---- HEADER WITH LINE ---- */
        header {
            width: 100%;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tiktok-logo {
            width: 110px;
            height: auto;
        }

        /* ---- SOLID CURVED ARROW ---- */
        .arrow-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 140px;
            animation: arrowUpDown 1.2s infinite ease-in-out;
            z-index: 100;
        }
        .arrow-svg {
            width: 100%;
            height: 100%;
        }

        @keyframes arrowUpDown {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(15px) rotate(0deg); }
        }

        /* ---- CENTRAL CIRCLE WITH DOTS ---- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px;
        }

        .dots-circle {
            width: 150px;
            height: 150px;
            background: #f8f8f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 60px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            overflow: visible;
        }

        /* ANIMACIÓN DE ALTERNANCIA */
        .content-dots, .content-text {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: alternateContent 4s infinite ease-in-out;
        }

        .content-dots {
            font-size: 3rem;
            color: #000;
            letter-spacing: -2px;
            font-weight: 900;
            margin-top: -10px;
        }

        .content-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: #000;
            line-height: 1.2;
            max-width: 100px;
            opacity: 0;
            animation-delay: 2s;
        }

        @keyframes alternateContent {
            0%, 45%, 100% { opacity: 1; transform: scale(1); }
            50%, 95% { opacity: 0; transform: scale(0.9); }
        }

        /* CLASSIC PIXEL HAND CURSOR */
        .hand-cursor {
            position: absolute;
            bottom: 5px;
            right: -10px;
            width: 55px;
            height: auto;
            z-index: 10;
            animation: clickAnim 1.2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes clickAnim {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(0.85) translateY(5px); }
        }

        /* ---- INSTRUCTIONS ---- */
        .headline {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .subheadline {
            font-size: 1rem;
            color: #333;
            line-height: 1.5;
            max-width: 280px;
        }

        .subheadline b {
            color: #000;
            font-weight: 800;
        }

        /* ---- FALLBACK ---- */
        .copy-link {
            position: absolute;
            bottom: 40px;
            font-size: 0.8rem;
            color: #cccccc;
            text-decoration: underline;
            cursor: pointer;
        }

        #android-msg {
            display: none;
            position: fixed;
            bottom: 20px;
            background: #f9f9f9;
            color: #666;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://f005.backblazeb2.com/file/BACKUP-DE-IMAGENES/ESPIRITUALIDAD/NEUROSYNC2.0/PAGINA+DE+VENTAS+NUEVA/TikTok_logo.png" alt="TikTok" class="tiktok-logo">
    </header>

    <!-- SOLID CURVED ARROW -->
    <div class="arrow-container">
        <svg class="arrow-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90C30 80 70 60 85 10" stroke="black" stroke-width="3.5" stroke-linecap="round" />
            <path d="M65 15L85 10L90 30" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>

    <div class="main-content">
        <div class="dots-circle">
            <!-- CONTENIDO QUE ALTERNA -->
            <div class="content-dots">...</div>
            <div class="content-text">Abrir en el navegador</div>
            
            <!-- CLASSIC PIXEL HAND CURSOR -->
            <img src="https://www.freeiconspng.com/uploads/hand-cursor-png-15.png" alt="click" class="hand-cursor">
        </div>

        <h1 class="headline">Para abrir esta página</h1>
        <p class="subheadline">
            toca los <b>tres puntos ...</b> y elige <br>
            <b>"Abrir en el navegador"</b>.
        </p>
    </div>

    <div class="copy-link" onclick="copyLink()">Copiar enlace manualmente</div>


    <div id="android-msg">Optimizando acceso...</div>

    <script>
    (function () {
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isAndroid = /Android/i.test(ua);

        if (isAndroid) {
            document.getElementById('android-msg').style.display = 'block';
            var cleanUrl = window.location.host + '/ventas/';
            setTimeout(function () {
                try {
                    window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
                } catch (e) {}
            }, 1500);
        }
    })();

    function copyLink() {
        var url = 'https://' + window.location.host + '/ventas/';
        navigator.clipboard.writeText(url).then(function() {
            alert("Enlace copiado.");
        });
    }
    </script>

</body>
</html>
