<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continuar al sitio — NeuroSync™</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- META TAGS DE PREVISUALIZACIÓN -->
    <meta property="og:title" content="NeuroSync™ | Acceso exclusivo">
    <meta property="og:description" content="Abre en tu navegador para desbloquear tu evolución.">
    <meta property="og:image" content="https://f005.backblazeb2.com/file/BACKUP-DE-IMAGENES/ESPIRITUALIDAD/NEUROSYNC2.0/PAGINA+DE+VENTAS+NUEVA/Dise%C3%B1o+sin+t%C3%ADtulo+(25).png">
    <meta property="og:type" content="website">

    <script>
        // REDIRECCIÓN INTELIGENTE
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isSocial = /TikTok|musical_ly|Instagram|FBAN|FBAV|Threads|Snapchat/i.test(ua);
            
            if (!isSocial) {
                // Si NO es social, redirigimos DE INMEDIATO a ventas
                window.location.replace('/ventas/');
            }
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            text-align: center;
        }

        /* ---- TIKTOK LOGO (SVG) ---- */
        .tiktok-logo {
            width: 130px;
            height: auto;
            margin-bottom: 40px;
            margin-top: -40px;
        }

        /* ---- HAND DRAWN ARROW ANIMATED ---- */
        .arrow-container {
            position: absolute;
            top: 25px;
            right: 40px;
            width: 90px;
            height: 90px;
            animation: arrowBounce 1.5s infinite ease-in-out;
        }
        .arrow-svg {
            width: 100%;
            height: 100%;
        }

        @keyframes arrowBounce {
            0%, 100% { transform: translate(0, 0) rotate(5deg); }
            50% { transform: translate(5px, -5px) rotate(0deg); }
        }

        /* ---- CENTRAL CIRCLE ---- */
        .central-indicator {
            width: 190px;
            height: 190px;
            background: #f4f5f7;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .globe-icon {
            font-size: 1.2rem;
            color: #444;
            margin-bottom: 10px;
        }

        .central-text {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            color: #000;
            max-width: 110px;
        }

        .cursor-hand {
            position: absolute;
            bottom: 25px;
            right: 15px;
            font-size: 2.8rem;
            color: #000;
            animation: handTap 1.2s infinite ease-in-out;
            transform-origin: top left;
        }

        @keyframes handTap {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(0.85) rotate(-5deg); }
        }

        /* ---- INSTRUCTIONS ---- */
        .headline {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.8px;
        }

        .subheadline {
            font-size: 1.15rem;
            color: #333;
            line-height: 1.4;
            max-width: 320px;
        }

        .subheadline b {
            color: #000;
            font-weight: 800;
        }

        /* ---- FALLBACK ---- */
        .copy-link {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #999;
            text-decoration: underline;
            cursor: pointer;
        }

        #android-msg {
            display: none;
            position: fixed;
            bottom: 30px;
            background: #000;
            color: #fff;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- ARROW POINTING TO TOP RIGHT -->
    <div class="arrow-container">
        <svg class="arrow-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 85C35 75 65 55 90 15" stroke="black" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5" />
            <path d="M70 15H90V35" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>

    <!-- TIKTOK LOGO PNG PROVIDED BY USER -->
    <img src="https://f005.backblazeb2.com/file/BACKUP-DE-IMAGENES/ESPIRITUALIDAD/NEUROSYNC2.0/PAGINA+DE+VENTAS+NUEVA/TikTok_logo.png" alt="TikTok" class="tiktok-logo">

    <div class="central-indicator">
        <i class="fas fa-globe globe-icon"></i>
        <div class="central-text">Abrir en el navegador</div>
        <i class="fas fa-hand-pointer cursor-hand"></i>
    </div>

    <h1 class="headline">Para abrir esta página</h1>
    <p class="subheadline">
        toca los <b>tres puntos ...</b> y elige <br>
        <b>"Abrir en el navegador"</b>.
    </p>

    <div class="copy-link" onclick="copyLink()">Copiar enlace manualmente</div>

    <div id="android-msg">Optimizando acceso...</div>

    <script>
    (function () {
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isAndroid = /Android/i.test(ua);

        if (isAndroid) {
            document.getElementById('android-msg').style.display = 'block';
            var cleanUrl = window.location.host + '/ventas/';
            setTimeout(function () {
                try {
                    window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
                } catch (e) {}
            }, 1500);
        }
    })();

    function copyLink() {
        var url = 'https://' + window.location.host + '/ventas/';
        navigator.clipboard.writeText(url).then(function() {
            alert("Enlace copiado.");
        });
    }
    </script>

</body>
</html>
